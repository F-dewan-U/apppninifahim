<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earning App - User Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-purple-700 text-white p-4 shadow-lg flex items-center space-x-4">
  <img id="userPhoto" src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-white"/>
  <div>
    <h1 id="userName" class="text-lg font-bold">User</h1>
    <p id="balance" class="text-sm font-bold text-yellow-300">ব্যালেন্স: 0.00 ৳</p>
  </div>
</header>

<main class="p-4 space-y-4">
  <button id="watchVideoAd" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg">
    🎥 ভিডিও বিজ্ঞাপন দেখুন (Zone 1)
  </button>

  <button id="openLinkAd" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg">
    🔗 ডাইরেক্ট লিঙ্ক ভিজিট করুন (Zone 2)
  </button>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB4NssZoOm4FwaaM-iLCPubPfg2doa9d1w",
    authDomain: "miniapp-6237e.firebaseapp.com",
    projectId: "miniapp-6237e",
    storageBucket: "miniapp-6237e.firebasestorage.app",
    messagingSenderId: "386637877982",
    appId: "1:386637877982:web:ac6608089a9348d823684f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const tg = window.Telegram.WebApp;

  let user = { id: tg.initDataUnsafe.user?.id || "123", balance: 0 };
  let zones = { zone1: "", zone2: "" };

  // Load User Data
  db.collection("users").doc(user.id.toString()).onSnapshot(doc => {
    if(doc.exists) { user = doc.data(); updateUI(); }
    else { db.collection("users").doc(user.id.toString()).set(user); }
  });

  // Load Both Zone IDs
  db.collection("settings").doc("ads").onSnapshot(doc => {
    if(doc.exists) {
      zones = doc.data();
      // Load Video Script for Zone 1
      let s = document.createElement("script");
      s.src = https://ad.gigapub.tech/script?id=${zones.zone1};
      document.body.appendChild(s);
    }
  });

  // Video Ad Click
  document.getElementById("watchVideoAd").onclick = () => {
    if(window.showGiga) {
      window.showGiga().then(() => { addMoney(0.10); }).catch(() => alert("Ad Error"));
    }
  };

  // Direct Link Click
  document.getElementById("openLinkAd").onclick = () => {
    if(zones.zone2) {
      window.open(zones.zone2, "_blank");
      addMoney(0.05); // লিঙ্ক ভিজিটে কম টাকা
    }
  };

  function addMoney(amount) {
    user.balance += amount;
    db.collection("users").doc(user.id.toString()).update({ balance: user.balance });
    alert(অভিনন্দন! আপনি ${amount} ৳ পেয়েছেন।);
  }

  function updateUI() {
    document.getElementById("balance").innerText = ব্যালেন্স: ${user.balance.toFixed(2)} ৳;
    document.getElementById("userName").innerText = tg.initDataUnsafe.user?.first_name || "User";
    document.getElementById("userPhoto").src = tg.initDataUnsafe.user?.photo_url || "https://via.placeholder.com/50";
  }
</script>
</body>
</html>
