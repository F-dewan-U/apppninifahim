<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin - Ad Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-bold mb-4">Ad Settings</h2>
      
      <label class="block text-sm font-medium mb-1">Zone 1 (Video Script ID)</label>
      <input id="z1" type="text" placeholder="Ex: 1101" class="w-full border p-2 rounded mb-4">

      <label class="block text-sm font-medium mb-1">Zone 2 (Direct Link URL)</label>
      <input id="z2" type="text" placeholder="https://..." class="w-full border p-2 rounded mb-4">

      <button onclick="saveAds()" class="w-full bg-purple-700 text-white py-2 rounded font-bold">Save Settings</button>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-md">
      <h2 class="font-bold mb-4">User List</h2>
      <div id="userList" class="space-y-2"></div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB4NssZoOm4FwaaM-iLCPubPfg2doa9d1w",
    authDomain: "miniapp-6237e.firebaseapp.com",
    projectId: "miniapp-6237e",
    storageBucket: "miniapp-6237e.firebasestorage.app",
    messagingSenderId: "386637877982",
    appId: "1:386637877982:web:ac6608089a9348d823684f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Load Current Settings
  db.collection("settings").doc("ads").get().then(doc => {
    if(doc.exists) {
      document.getElementById("z1").value = doc.data().zone1 || "";
      document.getElementById("z2").value = doc.data().zone2 || "";
    }
  });

  function saveAds() {
    const zone1 = document.getElementById("z1").value;
    const zone2 = document.getElementById("z2").value;
    db.collection("settings").doc("ads").set({ zone1, zone2 })
      .then(() => alert("Settings Updated!"));
  }

  // User List
  db.collection("users").onSnapshot(snap => {
    const list = document.getElementById("userList");
    list.innerHTML = "";
    snap.forEach(doc => {
      const u = doc.data();
      list.innerHTML += <div class="p-2 border-b flex justify-between">
        <span>${u.id}</span> <b>${u.balance.toFixed(2)} ৳</b>
      </div>;
    });
  });
</script>
</body>
</html>
