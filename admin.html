<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<title>Admin - Ad Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="font-bold mb-4 text-xl">অ্যাড সেটিংস</h2>
      <input id="z1" type="text" placeholder="Zone 1 ID (Video)" class="w-full border p-2 mb-4 rounded">
      <input id="z2" type="text" placeholder="Zone 2 Link (URL)" class="w-full border p-2 mb-4 rounded">
      <button onclick="saveAds()" class="w-full bg-purple-700 text-white py-2 rounded">Save</button>
    </div>
    <div id="userList" class="bg-white p-4 rounded shadow-md"></div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB4NssZoOm4FwaaM-iLCPubPfg2doa9d1w",
    authDomain: "miniapp-6237e.firebaseapp.com",
    projectId: "miniapp-6237e",
    storageBucket: "miniapp-6237e.firebasestorage.app",
    messagingSenderId: "386637877982",
    appId: "1:386637877982:web:ac6608089a9348d823684f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function saveAds() {
    const zone1 = document.getElementById("z1").value;
    const zone2 = document.getElementById("z2").value;
    db.collection("settings").doc("ads").set({ zone1, zone2 }).then(() => alert("Saved!"));
  }

  db.collection("users").onSnapshot(snap => {
    const list = document.getElementById("userList");
    list.innerHTML = "<h2 class='font-bold mb-2'>ইউজার লিস্ট:</h2>";
    snap.forEach(doc => {
      const u = doc.data();
      list.innerHTML += <div class='border-b p-2'>ID: ${u.id} - <b>${u.balance.toFixed(2)} ৳</b></div>;
    });
  });
</script>
</body>
</html>
